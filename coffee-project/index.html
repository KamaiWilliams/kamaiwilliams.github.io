
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>America Runs on Coffee</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script>
        (function(d) {
          var config = {
            kitId: 'wku7lnl',
            scriptTimeout: 3000,
            async: true
          },
          h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
        })(document);
      </script>
</head>

<body>

    <header>
        <div class="top-bar"></div>
    </header>

    <main>

        <section id="home" class="intro">
    
            <div class="hero-title">

                <div class="hero-left">
                    <h1 class="america-title">
                        america
                        <span>runs on</span>
                    </h1>
                </div>
            
                <div class="hero-right">
                    <h1 class="coffee-title">COFFEE</h1>
                </div>
            
            </div>
    
            <div class="intro-description">
    
                <p class="intro-text">
                    What does America’s relationship with coffee say about the way we live?
                </p>
            </div>
    
        </section>


      
        <section id="map" class="section">

            <div class="section-heading">
            
                <h2> coffee stats in different states</h2>

                <p>
                    Explore differences in economic conditions
                    across the us
                </p>
            </div>

            <div class="map-controls">

                <label for="metric-select">
                    Explore a statistic:
                </label>

                <select id="metric-select">
                    <option value="povertyRate">Poverty rate</option>
                    <option value="medianIncome">Median household income</option>
                    <option value="foodInsecurity">Food insecurity</option>
                    <option value="unemployment">Unemployment</option>
                </select>

            </div>

            <div class="map-layout">

                <div id="us-map"
                     role="region"
                     aria-label="Interactive map of socioeconomic statistics by US state">
                </div>

                <aside id="state-info" aria-live="polite">
                    <h3>Explore a state</h3>
                    <p>Select a state on the map to see its statistics.</p>
                </aside>

            </div>

            <p class="data-source">
                Source: U.S. Census Bureau, USDA, and BLS.
            </p>

        </section>


        
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
